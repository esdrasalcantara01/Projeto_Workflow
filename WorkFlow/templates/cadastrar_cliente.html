{% extends 'base.html' %}

{% block content %}

   <div id="cadastro-cliente" class="card-cliente">
        <h2> Cadastrar Novo Cliente </h2>
        <form method="post" enctype="multipart/form-data">
            {{ form.csrf_token }}
            {{ form.hidden_tag() }}
            
            <img 
            src="{{ url_for('static', filename='images/' ~ escolha_aleatória) }}" 
            width="100px" height="100px" 
            style="border-radius: 50px;">

            <p>
                <label>Nome Completo:</label><br>
                {{ form.nome(placeholder="nome") }}

            </p>
            {{ form.registrar }}
        </form>
    </div>
    
{% endblock %}
